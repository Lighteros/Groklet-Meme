<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in space | Groklet</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#03050B">
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
  <style>
    :root{--bg:#03050B;--teal:#19D8CF;--ink:#F0F4FA;--muted:#98A4BE}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink);
      font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
      background:radial-gradient(60% 50% at 80% 10%,rgba(121,82,199,.22),transparent 70%),radial-gradient(50% 45% at 10% 80%,rgba(25,216,207,.1),transparent 70%),var(--bg)}
    main{max-width:34rem}
    p.k{font-size:.75rem;letter-spacing:.26em;text-transform:uppercase;color:var(--teal);margin:0 0 1rem}
    h1{font-size:clamp(2.4rem,9vw,4.4rem);line-height:1;letter-spacing:-.03em;margin:0 0 1rem}
    p{color:var(--muted);line-height:1.7;margin:0 0 2rem}
    a{display:inline-flex;align-items:center;min-height:52px;padding:.9rem 1.6rem;background:var(--teal);color:#021012;text-decoration:none;font-weight:600;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;
      clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
    a:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #021012,inset 0 0 0 4px var(--ink)}
  </style>
</head>
<body>
  <main>
    <p class="k">Error 404</p>
    <h1>Lost in space.</h1>
    <p>That page drifted out of range. Even curious explorers take a wrong turn sometimes.</p>
    <a href="/">Back to Groklet</a>
  </main>
</body>
</html>
